id: nacl_encrypt_kem
label: Encrypt KEM
category: '[NACL]'

parameters:
-   id: filename_pk
    label: Filename public-key (receiver)
    dtype: string

inputs:
-   domain: message
    id: Msg clear
    optional: true

outputs:
-   domain: message
    id: Msg encrypted
    optional: true

templates:
    imports: import gnuradio.nacl as nacl
    make: nacl.encrypt_kem(${filename_pk})

cpp_templates:
    includes: ['#include <nacl/encrypt_kem.h>']
    declarations: 'nacl::encrypt_kem::sptr ${id};'
    make: 'this->${id} = nacl::encrypt_kem::make(${filename_pk});'
    link: ['gnuradio::gnuradio-nacl']

documentation: |-
    Encapsulate a shared secret with X-Wing KEM using the receiver public
    key, then encrypt the incoming PDU with crypto_secretbox. Output PDUs
    contain kem_ciphertext, nonce, and msg_encrypted tags.

file_format: 1
