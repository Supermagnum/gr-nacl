id: nacl_generate_kem_keypair
label: Generate KEM Keypair
category: '[NACL]'

parameters:
-   id: filename_sk
    label: Filename secret-key
    dtype: string
-   id: filename_pk
    label: Filename public-key
    dtype: string

templates:
    imports: import gnuradio.nacl as nacl
    make: nacl.generate_kem_keypair(${filename_sk}, ${filename_pk})

cpp_templates:
    includes: ['#include <nacl/generate_kem_keypair.h>']
    declarations: 'nacl::generate_kem_keypair::sptr ${id};'
    make: 'this->${id} = nacl::generate_kem_keypair::make(${filename_sk}, ${filename_pk});'
    link: ['gnuradio::gnuradio-nacl']

documentation: |-
    Generate an X-Wing (ML-KEM768 + X25519) KEM keypair and save the
    secret and public keys to binary files.

file_format: 1
